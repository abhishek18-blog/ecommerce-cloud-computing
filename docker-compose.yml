version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: ecommerce-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Product Microservice
  product-service:
    build:
      context: ./backend
    container_name: product-service
    ports:
      - "5001:5001"
    environment:
      - PRODUCT_SERVICE_PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
    command: node productService.js
    depends_on:
      - mongodb

  # 3. Order Microservice
  order-service:
    build:
      context: ./backend
    container_name: order-service
    ports:
      - "5002:5002"
    environment:
      - ORDER_SERVICE_PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
    command: node orderService.js
    depends_on:
      - mongodb

volumes:
  mongo_data:
